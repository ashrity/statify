[project]
name = "statify-pipeline"
version = "0.1.0"
description = "NFL projection pipeline for Statify"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "python-dotenv>=1.0",
    "tzdata>=2026.3",
]

[project.scripts]
statify = "statify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statify"]
