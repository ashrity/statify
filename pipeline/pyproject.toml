[project]
name = "statify-pipeline"
version = "0.1.0"
description = "NFL projection pipeline for Statify"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "nflreadpy>=0.1.5",
    "python-dotenv>=1.0",
    "tzdata>=2026.3",
]

[project.scripts]
statify = "statify.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Tests live next to the code they cover, so collection follows the *_test.py
# suffix rather than a separate tests/ tree.
python_files = ["*_test.py"]
testpaths = ["statify"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statify"]
